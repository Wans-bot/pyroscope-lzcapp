application:
  subdomain: pyroscope
  public_path:
    - /
    - /assets
    - /ingest
    - /readyz
    - /healthz
    - /favicon.svg
    - /config
  routes:
    - /=http://pyroscope.cloud.lazycat.app.pyroscope.lzcapp:4040
  health_check:
    test_url: http://pyroscope.cloud.lazycat.app.pyroscope.lzcapp:4040/
    start_period: 60s
services:
  pyroscope:
    # upstream: docker.io/grafana/pyroscope:2.4.1
    image: registry.lazycat.cloud/wans/grafana/pyroscope:dae0ab00a58e4d77
    user: root
    environment:
      - PYROSCOPE_LOG_LEVEL=info
    binds:
      - /lzcapp/var/pyroscope/data:/data
      - /lzcapp/var/pyroscope/data-compactor:/data-compactor
      - /lzcapp/var/pyroscope/data-metastore:/data-metastore
